<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="{{ t.tinta }}">
<title>{{ com.nombre }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/cliente.css') }}">
<style>:root{--fondo:{{ t.fondo }};--tinta:{{ t.tinta }};--acento:{{ t.acento }};--linea:{{ t.linea }};--sup:{{ t.sup }};--radio:{{ t.radio }};--fuente:{{ t.fuente }};--titulo:{{ t.titulo }}}</style>
{% if diseno.estilo %}<link rel="stylesheet" href="{{ diseno.estilo }}">{% endif %}
{% block cabeza %}{% endblock %}</head>
<body class="cliente d-{{ com.slug }}">
{% block cabecera %}<header class="marca">{{ logo }}<div><strong>{{ com.nombre }}</strong><small>{{ com.tagline }}</small></div></header>{% endblock %}
<main>{% block cuerpo %}{% endblock %}</main>
</body></html>
